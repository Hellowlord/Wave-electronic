<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Thank You | Wave Electronics</title>
<style>
  :root { --grad1:#667eea; --grad2:#764ba2; --accent:#00c9ff; }
  * { box-sizing: border-box; }
  body {
    margin: 0; font-family: 'Segoe UI', Arial, sans-serif; color: #fff;
    background: radial-gradient(1200px 600px at 20% -10%, #2c2c54 0%, #0f0f1a 60%);
    min-height: 100vh; display: grid; place-items: center; overflow-x: hidden;
  }
  .wrap { width: 100%; max-width: 960px; padding: 30px 20px 60px; text-align: center; position: relative; }
  .logo { display: inline-flex; align-items: center; gap: 10px; opacity: 0.9; }
  .logo span { font-weight: 800; letter-spacing: .5px; }
  .hero {
    margin-top: 10px;
    background: linear-gradient(135deg, var(--grad1), var(--grad2), var(--accent));
    -webkit-background-clip: text; background-clip: text; color: transparent;
    font-size: clamp(42px, 8vw, 84px); font-weight: 900; line-height: 1.05;
    text-shadow: 0 10px 40px rgba(0,0,0,.25);
  }
  .sub { font-size: clamp(16px, 2.5vw, 20px); opacity: .9; margin-top: 8px; }
  .card {
    margin: 28px auto 24px; width: 100%; max-width: 720px;
    background: #141428; border: 1px solid #2a2a3e; border-radius: 18px;
    padding: 18px;
  }
  .row { display: grid; grid-template-columns: 1fr 1fr; gap: 10px 16px; text-align: left; }
  .line { display: flex; justify-content: space-between; gap: 16px; padding: 10px 12px; border-radius: 10px; background:#101025; }
  .label { color: #9aa; font-size: 13px; }
  .val { font-weight: 700; color: #e8e8ff; }
  .total .val { color: var(--accent); font-size: 20px; }
  .orderref { margin-top: 10px; color:#9aa; font-size: 14px; }
  .cta { display: flex; justify-content: center; gap: 12px; flex-wrap: wrap; margin-top: 22px; }
  .btn { padding: 12px 18px; border-radius: 12px; border: 1px solid #2a2a3e; background: #1a1a2e; color: #fff; text-decoration: none; font-weight: 800; cursor: pointer; }
  .btn.primary { background: linear-gradient(135deg, var(--grad1), var(--grad2)); border: none; box-shadow: 0 10px 24px rgba(102,126,234,.25); }
  .btn:hover { filter: brightness(1.05); }
  footer { margin-top: 26px; font-size: 13px; color: #9aa; }

  .confetti { position: fixed; top: -16px; width: 12px; height: 18px; opacity: 0.95; z-index: 9999; border-radius: 3px; }
  @keyframes drop { 0% { transform: translateY(-10vh) rotate(0deg); } 100% { transform: translateY(110vh) rotate(720deg); } }
  @media (max-width: 680px){ .row { grid-template-columns: 1fr; } }
</style>
</head>
<body>
  <div class="wrap">
    <div class="logo"><span>🌊</span><span>Wave Electronics</span></div>
    <h1 class="hero">Thank you! 🎉</h1>
    <p class="sub">We’ve received your order and sent a copy to your email. We’ll be in touch soon.</p>

    <div class="card">
      <div class="row" id="summary">
        <div class="line"><div class="label">Product</div><div class="val" id="sProduct">—</div></div>
        <div class="line"><div class="label">Quantity</div><div class="val" id="sQty">—</div></div>
        <div class="line"><div class="label">Total</div><div class="val" id="sTotal">—</div></div>
        <div class="line"><div class="label">Date</div><div class="val" id="sDate">—</div></div>
        <div class="line"><div class="label">Time</div><div class="val" id="sTime">—</div></div>
        <div class="line total"><div class="label">Status</div><div class="val">Confirmed ✅</div></div>
      </div>
      <div class="orderref" id="sRef">Ref: —</div>
      <div class="cta">
        <a class="btn primary" href="index.html">Back to Home</a>
        <button class="btn" id="printBtn">Print Receipt</button>
        <a class="btn" id="contactBtn" href="#">Contact Support</a>
      </div>
    </div>

    <footer>Need help? Email us anytime.</footer>
  </div>

<script>
  // Parse query params
  const q = new URLSearchParams(location.search);
  const product = q.get('product') || 'Your item';
  const qty = parseInt(q.get('qty') || '1', 10);
  const total = q.get('total') || '';
  const date = q.get('date') || '';
  const time = q.get('time') || '';

  // Fill summary
  document.getElementById('sProduct').textContent = product;
  document.getElementById('sQty').textContent = isFinite(qty) ? qty : 1;
  document.getElementById('sTotal').textContent = total ? Number(total).toLocaleString() + ' EGP' : '—';

  // Compose a friendly date/time
  const tz = Intl.DateTimeFormat().resolvedOptions().timeZone || '';
  let prettyDate = date || new Date().toISOString().slice(0,10);
  let prettyTime = time || new Date().toTimeString().slice(0,8);
  document.getElementById('sDate').textContent = `${prettyDate} (${tz})`;
  document.getElementById('sTime').textContent = prettyTime;

  // Make a local reference code
  function ref() {
    const now = new Date();
    const y = String(now.getFullYear()).slice(-2);
    const m = String(now.getMonth()+1).padStart(2,'0');
    const d = String(now.getDate()).padStart(2,'0');
    const rand = Math.random().toString(36).slice(2,6).toUpperCase();
    return `W${y}${m}${d}-${rand}`;
  }
  const orderRef = ref();
  document.getElementById('sRef').textContent = `Ref: ${orderRef}`;

  // Buttons
  document.getElementById('printBtn').addEventListener('click', () => window.print());
  const contact = document.getElementById('contactBtn');
  contact.href = `mailto:adamsalem815@gmail.com?subject=Order%20Support%20${encodeURIComponent(orderRef)}&body=${encodeURIComponent(
    `Hello Wave,\n\nI need help with my order.\n\nOrder Ref: ${orderRef}\nProduct: ${product}\nQuantity: ${qty}\nTotal: ${total ? Number(total).toLocaleString()+' EGP' : '—'}\nDate: ${prettyDate}\nTime: ${prettyTime}\n\nThanks,`
  )}`;

  // Confetti
  function confettiBurst(count=180){
    const colors = ['#ff4757','#ffa502','#2ed573','#1e90ff','#a29bfe','#f368e0','#ff6b6b','#00d2d3'];
    for (let i=0;i<count;i++){
      const el = document.createElement('div');
      el.className = 'confetti';
      const size = Math.random()*8 + 6;
      el.style.width = size+'px';
      el.style.height = (size*1.4)+'px';
      el.style.left = (Math.random()*100)+'vw';
      el.style.background = colors[(Math.random()*colors.length)|0];
      el.style.transform = `rotate(${Math.random()*360}deg)`;
      const dur = (4 + Math.random()*3).toFixed(2) + 's';
      const delay = (Math.random()*0.6).toFixed(2) + 's';
      el.style.animation = `drop ${dur} linear forwards`;
      el.style.animationDelay = delay;
      document.body.appendChild(el);
      setTimeout(()=> el.remove(), 9000);
    }
  }
  confettiBurst();
</script>
</body>
</html>
