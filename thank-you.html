<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width,initial-scale=1"/>
  <title>Thank You — Wave Electronics</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" crossorigin >
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@500;700;800&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #0f172a; --panel:#0b1020; --text:#e2e8f0; --muted:#94a3b8;
      --brand:#22d3ee; --ok:#22c55e;
    }
    *{box-sizing:border-box}
    html,body{margin:0;padding:0;background:linear-gradient(120deg,#0b1226,#0a0f1d 60%,#0d162f);color:var(--text);font-family:Inter,system-ui,Segoe UI,Roboto,Arial,sans-serif}
    .wrap{max-width:860px;margin:0 auto;padding:28px 16px;display:grid;gap:16px}
    .panel{background:rgba(11,16,32,0.55);border:1px solid rgba(148,163,184,0.12);border-radius:14px;padding:18px;display:grid;gap:10px}
    h1{font-size:28px;margin:0}
    .muted{color:var(--muted)}
    .row{display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:space-between}
    .ref{font-weight:800;color:#a7f3d0}
    .btn{display:inline-flex;align-items:center;gap:8px;padding:10px 12px;border-radius:10px;border:1px solid rgba(148,163,184,0.14);background:linear-gradient(180deg,rgba(34,211,238,0.14),rgba(16,185,129,0.10));color:#e6fbff;font-weight:800;cursor:pointer}
    .grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
    @media (max-width:700px){.grid{grid-template-columns:1fr}}
    .kv{display:flex;justify-content:space-between;border-bottom:1px dashed rgba(148,163,184,0.18);padding:6px 0}
    .total{font-size:18px;font-weight:800;border-top:1px dashed rgba(148,163,184,0.18);padding-top:8px;margin-top:2px}
    a{color:var(--brand);text-decoration:none}
    .center{text-align:center}
  </style>
</head>
<body>
  <div class="wrap">
    <div class="panel">
      <div class="row">
        <h1>Thank you for your order! 🎉</h1>
        <button class="btn" onclick="window.print()">🖨️ Print</button>
      </div>
      <div class="muted">We’ve received your details and emailed a confirmation. We’ll contact you soon to arrange delivery/pickup.</div>
      <div>Order ref: <span id="ref" class="ref"></span></div>
    </div>

    <div class="panel">
      <div style="font-weight:800;letter-spacing:.3px;text-transform:uppercase;color:#9fb9c8">Order summary</div>
      <div class="grid">
        <div class="kv"><span>Product</span><span id="p"></span></div>
        <div class="kv"><span>Quantity</span><span id="q"></span></div>
        <div class="kv"><span>Date</span><span id="d"></span></div>
        <div class="kv"><span>Time</span><span id="t"></span></div>
        <div class="kv total"><span>Total</span><span id="tot"></span></div>
      </div>
    </div>

    <div class="panel center">
      Need help? <a href="mailto:adamsalem815@gmail.com">Contact Support</a> • <a href="./index.html">Back to home</a>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.9.3/dist/confetti.browser.min.js"></script>
  <script>
    function get(k, d='') { return new URLSearchParams(location.search).get(k) || d; }
    function ref() {
      const t = Date.now().toString(36).toUpperCase();
      const r = Math.random().toString(36).slice(2,6).toUpperCase();
      return `WAVE-${t}-${r}`;
    }
    document.getElementById('p').textContent = get('product','—');
    document.getElementById('q').textContent = get('qty','—');
    document.getElementById('d').textContent = get('date','—');
    document.getElementById('t').textContent = get('time','—');
    document.getElementById('tot').textContent = get('total','—');
    const savedRef = sessionStorage.getItem('wave_ref');
    const newRef = savedRef || ref();
    sessionStorage.setItem('wave_ref', newRef);
    document.getElementById('ref').textContent = newRef;

    // Confetti blast
    setTimeout(() => {
      const duration = 1800;
      const end = Date.now() + duration;
      (function frame() {
        confetti({ particleCount: 3, angle: 60, spread: 55, origin: { x: 0 } });
        confetti({ particleCount: 3, angle: 120, spread: 55, origin: { x: 1 } });
        if (Date.now() < end) requestAnimationFrame(frame);
      })();
      confetti({ particleCount: 150, spread: 70, origin: { y: 0.6 } });
    }, 150);
  </script>
</body>
</html>
